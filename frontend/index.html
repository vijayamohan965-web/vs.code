
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 30px 16px;
      color: #1e293b;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #00000010;
      margin-bottom: 20px;
    }

    h1, h2 {
      color: #1d4ed8;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .participant {
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 0;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">
      <h1>Technical Event Registration</h1>
      <p>Enter your details to register for the event.</p>

      <form id="registrationForm">
        <label for="roll_number">College Roll Number</label>
        <input
          type="text"
          id="roll_number"
          placeholder="Example: 25CS001"
          maxlength="20"
          required
        >

        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          maxlength="100"
          required
        >

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          maxlength="50"
          required
        >

        <label for="department">Department</label>
        <select id="department" required>
          <option value="">Select Department</option>
          <option value="CSE">CSE</option>
          <option value="IT">IT</option>
          <option value="ECE">ECE</option>
          <option value="EEE">EEE</option>
          <option value="MECH">MECH</option>
        </select>

        <button type="submit">Register Now</button>
      </form>

      <p id="message" role="status"></p>
    </section>

    <section class="card">
      <h2>Registered Participants</h2>
      <button type="button" id="loadButton">
        View Registrations
      </button>
      <div id="participants"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("registrationForm");
    const message = document.getElementById("message");
    const participants = document.getElementById("participants");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const data = {
        roll_number: document.getElementById("roll_number").value.trim(),
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        department: document.getElementById("department").value
      };

      message.textContent = "Submitting registration...";

      try {
        const response = await fetch("/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        message.textContent = result.message;

        if (response.ok) {
          form.reset();
          await loadRegistrations();
        }
      } catch (error) {
        message.textContent =
          "Cannot contact the server. Check whether it is running.";
      }
    });

    async function loadRegistrations() {
      participants.textContent = "Loading registrations...";

      try {
        const response = await fetch("/registrations");

        if (!response.ok) {
          throw new Error("Unable to load registrations");
        }

        const records = await response.json();
        participants.replaceChildren();

        if (records.length === 0) {
          participants.textContent = "No registrations yet.";
          return;
        }

        records.forEach(function(record) {
          const item = document.createElement("div");
          item.className = "participant";

          const details = document.createElement("p");
          details.textContent =
            "Roll Number: " + record.roll_number +
            " | Name: " + record.name +
            " | Department: " + record.department +
            " | Email: " + record.email;

          item.appendChild(details);
          participants.appendChild(item);
        });
      } catch (error) {
        participants.textContent =
          "Could not load registrations.";
      }
    }

    document.getElementById("loadButton")
      .addEventListener("click", loadRegistrations);
  </script>
</body>
</html>
